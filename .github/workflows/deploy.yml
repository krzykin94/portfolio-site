name: Deploy to FTP

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'blog.html'
      - 'cms-save.php'
      - 'manager.html'

jobs:
  deploy-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy main site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /domains/krzysztofkinder.pl/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            manager.html
            manager-index.html

  deploy-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare manager index
        run: |
          mkdir -p manager-deploy
          cp manager.html manager-deploy/index.html
          cp cms-save.php manager-deploy/cms-save.php

      - name: Deploy manager subdomain via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./manager-deploy/
          server-dir: /domains/manager.krzysztofkinder.pl/public_html/
          dangerous-clean-slate: false
